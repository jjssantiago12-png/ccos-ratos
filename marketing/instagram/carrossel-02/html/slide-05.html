<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1350px; overflow: hidden; background: #111; font-family: 'Arial Black', Arial, sans-serif; }
.slide { width: 1080px; height: 1350px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #111111; }
.top-bar { position: absolute; top: 0; left: 0; right: 0; height: 6px; background: #E87A1E; }
.bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 6px; background: #E87A1E; }
.deco-line-left { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: #E87A1E; opacity: 0.3; }
.deco-line-right { position: absolute; right: 0; top: 0; bottom: 0; width: 6px; background: #E87A1E; opacity: 0.3; }
.inner { text-align: center; padding: 80px; }
.eyebrow { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 5px; color: #E87A1E; text-transform: uppercase; margin-bottom: 32px; }
.logo { font-size: 80px; font-weight: 900; letter-spacing: 6px; color: white; text-transform: uppercase; line-height: 1; }
.logo span { color: #E87A1E; }
.tagline { font-family: Arial, sans-serif; font-size: 24px; color: rgba(255,255,255,0.5); letter-spacing: 3px; text-transform: uppercase; margin-top: 16px; }
.divider { width: 80px; height: 4px; background: #E87A1E; margin: 48px auto; }
.cta-text { font-family: Arial, sans-serif; font-size: 28px; color: white; font-weight: 700; margin-bottom: 12px; }
.cta-sub { font-family: Arial, sans-serif; font-size: 20px; color: rgba(255,255,255,0.55); margin-bottom: 40px; }
.wpp-btn { display: inline-block; background: #E87A1E; color: white; font-family: 'Arial Black', Arial, sans-serif; font-size: 22px; font-weight: 900; letter-spacing: 2px; padding: 20px 52px; text-transform: uppercase; }
.location { font-family: Arial, sans-serif; font-size: 18px; color: rgba(255,255,255,0.4); margin-top: 48px; letter-spacing: 2px; text-transform: uppercase; }
</style>
</head>
<body>
<div class="slide">
  <div class="top-bar"></div>
  <div class="bottom-bar"></div>
  <div class="deco-line-left"></div>
  <div class="deco-line-right"></div>
  <div class="inner">
    <div class="eyebrow">Moda que chega até você</div>
    <div class="logo">YAGO <span>MODAS</span></div>
    <div class="tagline">A loja que vai até você</div>
    <div class="divider"></div>
    <div class="cta-text">Quer receber as novidades em primeira mão?</div>
    <div class="cta-sub">Manda mensagem no WhatsApp</div>
    <div class="wpp-btn">Fale Conosco</div>
    <div class="location">Grande Vitória · ES</div>
  </div>
</div>
</body>
</html>
