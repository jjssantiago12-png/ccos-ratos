<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Yago Modas — Catálogo</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background:#0f0f0f;color:#fff;min-height:100vh}
:root{--laranja:#E87A1E;--escuro:#111;--card:#191919;--borda:#242424}

/* ── HEADER ── */
.header{background:#111;border-bottom:3px solid var(--laranja);padding:12px 16px;position:sticky;top:0;z-index:300;display:flex;align-items:center;gap:10px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;white-space:nowrap}
.logo b{color:var(--laranja)}
.search-box{flex:1;position:relative}
.search-box input{width:100%;padding:9px 36px 9px 14px;border-radius:10px;border:1.5px solid var(--borda);background:#1c1c1c;color:#fff;font-size:14px;outline:none;font-family:inherit}
.search-box input:focus{border-color:var(--laranja)}
.search-box input::placeholder{color:#555}
.search-box .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:#555;cursor:pointer;display:none;font-size:18px;line-height:1}

/* ── TRILHA (breadcrumb) ── */
.trilha{display:flex;align-items:center;gap:6px;padding:12px 16px 0;font-size:12px;color:#555;flex-wrap:wrap}
.trilha .crumb{cursor:pointer;color:#888;transition:color .2s}
.trilha .crumb:hover{color:var(--laranja)}
.trilha .crumb.ativo{color:#fff;font-weight:600;cursor:default}
.trilha .sep{color:#333}

/* ── SEÇÃO HERO (tiles de categoria) ── */
.secao-titulo{padding:16px 16px 10px;font-size:11px;font-weight:700;letter-spacing:2px;color:#666;text-transform:uppercase}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}
@media(min-width:500px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media(min-width:700px){.tiles{grid-template-columns:repeat(5,1fr)}}
.tile{background:var(--card);border:1.5px solid var(--borda);border-radius:14px;padding:20px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:all .2s;text-align:center;min-height:90px}
.tile:hover,.tile.ativo{border-color:var(--laranja);background:#1f1a14}
.tile.ativo .tile-icon{color:var(--laranja)}
.tile.ativo .tile-label{color:var(--laranja)}
.tile-icon{font-size:26px;line-height:1}
.tile-label{font-size:12px;font-weight:700;color:#aaa;letter-spacing:.5px;text-transform:uppercase}
.tile-qtd{font-size:10px;color:#555}

/* ── CHIPS DE CATEGORIA ── */
.chips-section{padding:0 16px 12px}
.chips-label{font-size:10px;font-weight:700;letter-spacing:1.5px;color:#555;text-transform:uppercase;margin-bottom:8px}
.chips-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips-row::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 15px;border-radius:22px;border:1.5px solid var(--borda);background:transparent;color:#888;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;letter-spacing:.3px}
.chip.ativo{background:var(--laranja);border-color:var(--laranja);color:#111}
.chip:hover:not(.ativo){border-color:#555;color:#ccc}

/* ── TAMANHOS ── */
.tams-section{padding:0 16px 14px;display:none}
.tams-section.visivel{display:block}
.tams-label{font-size:10px;font-weight:700;letter-spacing:1.5px;color:#555;text-transform:uppercase;margin-bottom:8px}
.tams-grupo{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tam-chip{min-width:44px;padding:8px 10px;border-radius:8px;border:1.5px solid var(--borda);background:transparent;color:#999;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;text-align:center}
.tam-chip.ativo{background:var(--laranja);border-color:var(--laranja);color:#111;font-weight:800}
.tam-chip:hover:not(.ativo){border-color:#666;color:#fff}
.tams-sublabel{font-size:10px;color:#555;margin-bottom:5px;margin-top:4px}

/* ── BARRA DE RESULTADO ── */
.barra-resultado{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px}
.resultado-txt{font-size:12px;color:#666}
.resultado-txt strong{color:var(--laranja)}
.btn-limpar{font-size:11px;color:#555;background:none;border:none;cursor:pointer;font-family:inherit;text-decoration:underline;padding:4px}

/* ── GRID ── */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 100px}
@media(min-width:540px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr);padding:0 20px 100px}}

/* ── CARD ── */
.card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--borda);display:flex;flex-direction:column}
.card-foto{position:relative;aspect-ratio:3/4;background:#222;overflow:hidden;cursor:pointer}
.card-foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.card-foto img.ativa{opacity:1}
.card-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#2e2e2e;pointer-events:none}
.card-placeholder svg{width:30px;height:30px}
.card-placeholder span{font-size:10px;color:#3a3a3a}
.badge-tam{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.85);color:var(--laranja);font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:.5px}
.badge-sec{position:absolute;top:8px;right:8px;font-size:9px;font-weight:700;padding:3px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.5px}
.badge-sec.feminino{background:#7b1f5a;color:#fff}
.badge-sec.masculino{background:#1a3d6b;color:#fff}
.badge-sec.infantil{background:#1b5e35;color:#fff}
.foto-nav{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:4px;padding:8px;background:linear-gradient(transparent,rgba(0,0,0,.5))}
.foto-dot{width:5px;height:5px;border-radius:50%;background:#555;cursor:pointer;transition:background .2s}
.foto-dot.ativo{background:var(--laranja)}
.card-info{padding:10px 11px 12px;display:flex;flex-direction:column;gap:5px}
.card-cod{font-size:10px;color:#555;letter-spacing:.3px}
.card-nome{font-size:12px;color:#ccc;line-height:1.35;min-height:30px}
.card-preco{font-size:18px;font-weight:800;color:#fff}
.card-preco small{font-size:10px;font-weight:400;color:#666}
.card-btn{margin-top:2px;width:100%;padding:9px 8px;background:var(--laranja);color:#111;border:none;border-radius:9px;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px;letter-spacing:.3px}
.card-btn svg{width:13px;height:13px;flex-shrink:0;fill:currentColor}
.card-btn:active{opacity:.8}

/* ── VAZIO ── */
.vazio{grid-column:1/-1;text-align:center;padding:60px 20px;color:#444}
.vazio p{margin-top:10px;font-size:13px}

/* ── FOOTER ── */
.footer{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #1a1a1a;padding:10px 16px;text-align:center;font-size:11px;color:#444}
.footer b{color:var(--laranja)}
</style>
</head>

  <div class="grid" id="grid"></div>
</div>

const TAMS_LETRA=["PP","P","P2","M","G","G2","G3","G4","GG","GG2","GG3","GG4","GG5","XG","XGG","GGG"];
const TAMS_NUM=["34","36","38","40","42","44","46","48","50","52","54","56","58","60","62","64"];
const TAMS_INF=["2 ANOS","3 ANOS","4 ANOS","6 ANOS","8 ANOS","10 ANOS","12 ANOS","14 ANOS","16 ANOS"];

const SECOES=[
  {id:"feminino",label:"Feminino",icon:"👗"},
  {id:"masculino",label:"Masculino",icon:"👕"},
  {id:"infantil",label:"Infantil",icon:"🧒"},
  {id:"casa",label:"Casa",icon:"🏠"},
  {id:"geral",label:"Geral",icon:"🛍️"}
];

let estado={sec:"",cat:"",tam:"",busca:""};

// ── TILES INICIAIS ──
function initTiles(){
  const el=document.getElementById("tiles-sec");
  el.innerHTML=SECOES.map(s=>{
    const n=PRODS.filter(p=>p.sec===s.id).length;
    return `<div class="tile" onclick="setSec('${s.id}')">
      <div class="tile-icon">${s.icon}</div>
      <div class="tile-label">${s.label}</div>
      <div class="tile-qtd">${n} produtos</div>
    </div>`;
  }).join("");
}

function setSec(sec){
  estado={sec,cat:"",tam:"",busca:""};
  document.getElementById("busca").value="";
  document.getElementById("clear-btn").style.display="none";
  document.getElementById("tela-inicio").style.display="none";
  document.getElementById("tela-filtros").style.display="";
  renderCats(); renderTams(); renderGrid(); renderTrilha();
}

// ── CATEGORIAS ──
function renderCats(){
  const cats=[...new Set(PRODS.filter(p=>p.sec===estado.sec).map(p=>p.cat))].sort();
  const wrap=document.getElementById("chips-cat-wrap");
  const row=document.getElementById("chips-cat");
  if(!cats.length){wrap.style.display="none";return;}
  wrap.style.display="";
  row.innerHTML=`<button class="chip ${!estado.cat?"ativo":""}" onclick="setCat('')">Todos</button>`+
    cats.map(c=>`<button class="chip ${estado.cat===c?"ativo":""}" onclick="setCat('${c.replace(/'/g,"\\'")}')">
      ${c}
    </button>`).join("");
}

function setCat(cat){
  estado.cat=cat; estado.tam="";
  renderCats(); renderTams(); renderGrid(); renderTrilha();
}

// ── TAMANHOS ──
function renderTams(){
  const base=PRODS.filter(p=>
    p.sec===estado.sec &&(!estado.cat||p.cat===estado.cat)&&p.tam
  );
  const tams=new Set(base.map(p=>p.tam));
  const sec=document.getElementById("tams-section");
  if(!tams.size){sec.classList.remove("visivel");return;}
  sec.classList.add("visivel");

  const letra=TAMS_LETRA.filter(t=>tams.has(t));
  const num=TAMS_NUM.filter(t=>tams.has(t));
  const inf=TAMS_INF.filter(t=>tams.has(t));

  const mkChips=(arr,containerId)=>{
    const el=document.getElementById(containerId);
    el.innerHTML=arr.map(t=>
      `<button class="tam-chip ${estado.tam===t?"ativo":""}" onclick="setTam('${t}')">${t}</button>`
    ).join("");
  };

  mkChips(letra,"tams-letra");
  document.getElementById("tams-num-wrap").style.display=num.length?"":"none";
  mkChips(num,"tams-num");
  document.getElementById("tams-inf-wrap").style.display=inf.length?"":"none";
  mkChips(inf,"tams-inf");
}

function setTam(t){
  estado.tam=estado.tam===t?"":t;
  renderTams(); renderGrid(); renderTrilha();
  document.getElementById("btn-limpar").style.display=
    (estado.cat||estado.tam)?"":"none";
}

// ── BUSCA ──
function onBusca(){
  estado.busca=document.getElementById("busca").value.toLowerCase().trim();
  document.getElementById("clear-btn").style.display=estado.busca?"":"none";
  if(estado.busca&&!estado.sec){
    // busca global sem seção
    document.getElementById("tela-inicio").style.display="none";
    document.getElementById("tela-filtros").style.display="";
    document.getElementById("chips-cat-wrap").style.display="none";
    document.getElementById("tams-section").classList.remove("visivel");
  }
  renderGrid(); renderTrilha();
}

function limparBusca(){
  document.getElementById("busca").value="";
  document.getElementById("clear-btn").style.display="none";
  estado.busca="";
  if(!estado.sec){
    document.getElementById("tela-inicio").style.display="";
    document.getElementById("tela-filtros").style.display="none";
  }
  renderGrid();
}

function limparFiltros(){
  estado.cat=""; estado.tam="";
  document.getElementById("btn-limpar").style.display="none";
  renderCats(); renderTams(); renderGrid(); renderTrilha();
}

// ── TRILHA ──
function renderTrilha(){
  const el=document.getElementById("trilha");
  const partes=[];
  partes.push(`<span class="crumb" onclick="voltarInicio()">Início</span>`);
  if(estado.sec){
    const s=SECOES.find(x=>x.id===estado.sec);
    partes.push(`<span class="sep">›</span>`);
    partes.push(`<span class="crumb ${!estado.cat?"ativo":""}" onclick="setSec('${estado.sec}')">${s.icon} ${s.label}</span>`);
  }
  if(estado.cat){
    partes.push(`<span class="sep">›</span>`);
    partes.push(`<span class="crumb ${!estado.tam?"ativo":""}" onclick="setCat('${estado.cat.replace(/'/g,"\\'")}')}">${estado.cat}</span>`);
  }
  if(estado.tam){
    partes.push(`<span class="sep">›</span>`);
    partes.push(`<span class="crumb ativo">Tam. ${estado.tam}</span>`);
  }
  if(estado.busca&&!estado.sec){
    partes.push(`<span class="sep">›</span>`);
    partes.push(`<span class="crumb ativo">Busca: "${estado.busca}"</span>`);
  }
  el.innerHTML=partes.join("");
}

function voltarInicio(){
  estado={sec:"",cat:"",tam:"",busca:""};
  document.getElementById("busca").value="";
  document.getElementById("clear-btn").style.display="none";
  document.getElementById("tela-inicio").style.display="";
  document.getElementById("tela-filtros").style.display="none";
  renderTrilha();
}

// ── GRID ──
function renderGrid(){
  const lista=PRODS.filter(p=>{
    if(estado.sec&&p.sec!==estado.sec)return false;
    if(estado.cat&&p.cat!==estado.cat)return false;
    if(estado.tam&&p.tam!==estado.tam)return false;
    if(estado.busca&&!p.desc.toLowerCase().includes(estado.busca)&&!String(p.cod).includes(estado.busca))return false;
    return true;
  });

  const n=lista.length;
  document.getElementById("resultado-txt").innerHTML=
    `<strong>${n}</strong> produto${n!==1?"s":""} encontrado${n!==1?"s":""}`;
  document.getElementById("btn-limpar").style.display=
    (estado.cat||estado.tam)?"":"none";

  const grid=document.getElementById("grid");
  if(!lista.length){
    grid.innerHTML=`<div class="vazio">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.5">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <p>Nenhum produto encontrado</p>
    </div>`;
    return;
  }

  grid.innerHTML=lista.map(p=>{
    const dir=`fotos/${p.cod}`;
    const imgs=[1,2,3].map((i,idx)=>
      `<img src="${dir}/${i}.jpg" alt="${p.desc}" loading="lazy" class="${idx===0?"ativa":""}"
        onerror="this.remove();syncDots(this.closest('.card-foto'))">`
    ).join("");
    const secBadge=p.sec!=="geral"
      ?`<span class="badge-sec ${p.sec}">${{feminino:"Fem",masculino:"Masc",infantil:"Inf",casa:"Casa"}[p.sec]||""}</span>`:"";
    const tamBadge=p.tam?`<span class="badge-tam">${p.tam}</span>`:"";
    const msg=encodeURIComponent(`Olá! Quero reservar:\nCódigo: ${p.cod}\n${p.desc}\nR$ ${p.preco.toFixed(2)}`);
    return `<div class="card">
      <div class="card-foto" onclick="nextFoto(this)">
        ${imgs}
        <div class="card-placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="m21 15-5-5L5 21"/>
          </svg>
          <span>Foto em breve</span>
        </div>
        ${tamBadge}${secBadge}
        <div class="foto-nav" id="nav${p.cod}">
          <span class="foto-dot ativo"></span>
          <span class="foto-dot"></span>
          <span class="foto-dot"></span>
        </div>
      </div>
      <div class="card-info">
        <div class="card-cod">Cód. ${p.cod}</div>
        <div class="card-nome">${p.desc}</div>
        <div class="card-preco">R$ ${p.preco.toFixed(2)} <small>/ un</small></div>
        <button class="card-btn" onclick="window.open('https://wa.me/${WA}?text=${msg}','_blank')">
          <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.117 1.528 5.845L.057 23.625a.75.75 0 0 0 .922.899l5.919-1.53A11.955 11.955 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.99 0-3.85-.575-5.42-1.57l-.39-.24-4.02 1.04 1.06-3.93-.25-.4A9.964 9.964 0 0 1 2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
          Reservar via WhatsApp
        </button>
      </div>
    </div>`;
  }).join("");
  document.querySelectorAll(".card-foto").forEach(syncDots);
}

function nextFoto(fw){
  const imgs=fw.querySelectorAll("img");
  if(!imgs.length)return;
  let i=0;
  imgs.forEach((img,idx)=>{if(img.classList.contains("ativa"))i=idx;});
  imgs.forEach(img=>img.classList.remove("ativa"));
  imgs[(i+1)%imgs.length].classList.add("ativa");
  syncDots(fw);
}

function syncDots(fw){
  const imgs=fw.querySelectorAll("img");
  const dots=fw.querySelectorAll(".foto-dot");
  let a=0;
  imgs.forEach((img,i)=>{if(img.classList.contains("ativa"))a=i;});
  dots.forEach((d,i)=>{
    d.style.display=i<imgs.length?"":"none";
    d.classList.toggle("ativo",i===a);
  });
}

initTiles();
</script>
