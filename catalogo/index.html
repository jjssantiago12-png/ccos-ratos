<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yago Modas — Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:#111;color:#fff;min-height:100vh}

  /* HEADER */
  header{background:#111;border-bottom:2px solid #E87A1E;padding:16px 20px;position:sticky;top:0;z-index:100}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#E87A1E;letter-spacing:2px}
  .logo span{color:#fff}
  .tagline{font-size:11px;color:#888;margin-top:2px}

  /* BUSCA */
  .search-bar{padding:16px 20px;background:#1a1a1a}
  .search-bar input{width:100%;padding:12px 16px;border-radius:8px;border:1px solid #333;background:#222;color:#fff;font-size:15px;outline:none}
  .search-bar input:focus{border-color:#E87A1E}
  .search-bar input::placeholder{color:#666}

  /* CATEGORIAS */
  .cats{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;background:#1a1a1a;border-bottom:1px solid #222;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .cat-btn{white-space:nowrap;padding:8px 16px;border-radius:20px;border:1px solid #333;background:transparent;color:#aaa;font-size:13px;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif}
  .cat-btn.ativo{background:#E87A1E;border-color:#E87A1E;color:#111;font-weight:700}

  /* CONTADOR */
  .contador{padding:12px 20px;font-size:13px;color:#666}
  .contador strong{color:#E87A1E}

  /* GRID */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 20px 100px}
  @media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}

  /* CARD */
  .card{background:#1e1e1e;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .fotos{position:relative;aspect-ratio:1;background:#2a2a2a;overflow:hidden}
  .fotos img{width:100%;height:100%;object-fit:cover;display:none}
  .fotos img.ativa{display:block}
  .fotos .placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#444;font-size:12px;gap:8px}
  .fotos .placeholder svg{opacity:.3}
  .nav-foto{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
  .nav-foto span{width:6px;height:6px;border-radius:50%;background:#555;cursor:pointer;transition:background .2s}
  .nav-foto span.ativa{background:#E87A1E}
  .info{padding:12px}
  .cod{font-size:10px;color:#E87A1E;font-weight:700;letter-spacing:1px;margin-bottom:4px}
  .nome{font-size:13px;color:#eee;line-height:1.3;margin-bottom:6px;min-height:34px}
  .preco{font-size:18px;font-weight:700;color:#fff;margin-bottom:10px}
  .preco small{font-size:11px;color:#888;font-weight:400}
  .btn-reservar{width:100%;padding:10px;background:#E87A1E;color:#111;border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:opacity .2s}
  .btn-reservar:active{opacity:.8}

  /* VAZIO */
  .vazio{grid-column:1/-1;text-align:center;padding:60px 20px;color:#555}
  .vazio svg{opacity:.2;margin-bottom:16px}

  /* FOOTER */
  footer{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;padding:12px 20px;text-align:center;font-size:12px;color:#555}
</style>
</head>
<body>

<header>
  <div class="logo">YAGO <span>MODAS</span></div>

<div class="grid" id="grid"></div>

const categorias = [...new Set(produtos.map(p => p.categoria))].sort();
const catsDiv = document.getElementById('cats');
categorias.forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'cat-btn';
  btn.textContent = cat;
  btn.onclick = () => selecionarCat(cat, btn);
  catsDiv.appendChild(btn);
});

let catAtiva = '';
let busca = '';

function selecionarCat(cat, btn) {
  catAtiva = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('ativo'));
  btn.classList.add('ativo');
  filtrar();
}

function filtrar() {
  busca = document.getElementById('busca').value.toLowerCase().trim();
  const filtrados = produtos.filter(p => {
    const matchCat = !catAtiva || p.categoria === catAtiva;
    const matchBusca = !busca || p.descricao.toLowerCase().includes(busca) || String(p.cod).includes(busca);
    return matchCat && matchBusca;
  });
  renderizar(filtrados);
}

function renderizar(lista) {
  const grid = document.getElementById('grid');
  const contador = document.getElementById('contador');
  contador.innerHTML = `Mostrando <strong>${lista.length}</strong> produto${lista.length !== 1 ? 's' : ''}`;

  if (!lista.length) {
    grid.innerHTML = `<div class="vizio">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <p>Nenhum produto encontrado</p>
    </div>`;
    return;
  }

  grid.innerHTML = lista.map(p => {
    const fotoDir = `fotos/${p.cod}`;
    const fotos = [1, 2, 3].map(i =>
      `<img src="${fotoDir}/${i}.jpg" alt="${p.descricao}" loading="lazy" onerror="this.style.display='none'" class="${i === 1 ? 'ativa' : ''}">`
    ).join('');

    const msg = encodeURIComponent(`Olá! Quero reservar o produto:\nCódigo: ${p.cod}\nNome: ${p.descricao}\nPreço: R$ ${p.preco.toFixed(2)}`);
    const link = `https://wa.me/${WHATSAPP}?text=${msg}`;

    return `<div class="card">
      <div class="fotos" id="f${p.cod}">
        ${fotos}
        <div class="placeholder">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          <span>Sem foto</span>
        </div>
        <div class="nav-foto">
          <span class="ativa" onclick="trocarFoto('f${p.cod}', 0, this)"></span>
          <span onclick="trocarFoto('f${p.cod}', 1, this)"></span>
          <span onclick="trocarFoto('f${p.cod}', 2, this)"></span>
        </div>
      </div>
      <div class="info">
        <div class="cod">Cód. ${p.cod}</div>
        <div class="nome">${p.descricao}</div>
        <div class="preco">R$ ${p.preco.toFixed(2)} <small>/ unidade</small></div>
        <button class="btn-reservar" onclick="window.open('${link}','_blank')">Reservar via WhatsApp</button>
      </div>
    </div>`;
  }).join('');
}

function trocarFoto(id, idx, dot) {
  const container = document.getElementById(id);
  const imgs = container.querySelectorAll('img');
  const dots = container.querySelectorAll('.nav-foto span');
  imgs.forEach((img, i) => {
    img.classList.toggle('ativa', i === idx);
  });
  dots.forEach((d, i) => d.classList.toggle('ativa', i === idx));
}

filtrar();
